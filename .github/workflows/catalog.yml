name: Catalogue

# Rebuilds catalog.json and the icons from the apps listed in apps.json (hourly, and when they change) and deploys the whole site to GitHub Pages.
# Nothing is committed: the catalogue lives only in the Pages artifact. A refused APK fails the last step, after every good entry is live.
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: [apps.json, tools/build_catalog.py, .github/workflows/catalog.yml]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Self-test
        run: python3 -I tools/check_catalog.py
      - name: Build the catalogue
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: BUILD_TOOLS="$ANDROID_HOME/build-tools/36.0.0" python3 -I tools/build_catalog.py _site
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
      - name: Fail if any APK was refused
        run: test ! -s errors.txt || { cat errors.txt; exit 1; }
